name: Compile Topsl

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topsl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    # Standard public-repository runners are free. Do not silently consume private-repo minutes.
    if: github.event.repository.private == false
    name: ${{ matrix.name }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-15
            target: --mac --arm64
          - name: macOS Intel
            os: macos-15-intel
            target: --mac --x64
          - name: Windows x64
            os: windows-2025
            target: --win --x64
          - name: Linux x64
            os: ubuntu-24.04
            target: --linux --x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 xvfb
      - name: Install locked dependencies and compile native modules
        run: npm ci
      - name: Typecheck, integration tests, and application build
        run: npm run check
      - name: Desktop acceptance smoke
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Linux desktop acceptance smoke
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:desktop
      - name: Compile installable application
        run: npm run package -- ${{ matrix.target }}
      - name: Record package checksums
        run: node scripts/package-summary.mjs
      # No artifact or dependency-cache uploads: avoid storage charges as well as paid runners.
      # Packages are compiled and verified on each runner; persistent release distribution is separate.
