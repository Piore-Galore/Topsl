name: Diagnose Windows process query
on:
  push:
    branches: ["claude/diag-windows-cim"]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reproduce the CIM process query
        run: node diag/windows-cim.mjs
